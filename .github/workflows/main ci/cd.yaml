name: 🚀 CI / CD — Thanu Nayak Portfolio

# ── Triggers ───────────────────────────────────────────────────
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:          # allow manual run from GitHub UI

# ── Global env ────────────────────────────────────────────────
env:
  NODE_VERSION: '20'
  PHP_VERSION:  '8.2'

# ══════════════════════════════════════════════════════════════
jobs:

# ──────────────────────────────────────────────────────────────
# JOB 1 — Lint & validate frontend files
# ──────────────────────────────────────────────────────────────
  lint-frontend:
    name: 🎨 Lint Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend dev dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint CSS (stylelint)
        working-directory: frontend
        run: npx stylelint "css/**/*.css" --config .stylelintrc.json

      - name: Lint JavaScript (ESLint)
        working-directory: frontend
        run: npx eslint "js/**/*.js" --max-warnings 0

      - name: Validate HTML (htmlhint)
        working-directory: frontend
        run: npx htmlhint "*.html"

# ──────────────────────────────────────────────────────────────
# JOB 2 — Test & lint Node.js backend
# ──────────────────────────────────────────────────────────────
  test-nodejs:
    name: 🟢 Test Node.js Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/nodejs/package.json

      - name: Install dependencies
        working-directory: backend/nodejs
        run: npm ci

      - name: Lint (ESLint)
        working-directory: backend/nodejs
        run: npx eslint . --max-warnings 0

      - name: Run unit tests
        working-directory: backend/nodejs
        run: npm test
        env:
          NODE_ENV: test
          PORT: 3001

      - name: Check for security vulnerabilities
        working-directory: backend/nodejs
        run: npm audit --audit-level=high

# ──────────────────────────────────────────────────────────────
# JOB 3 — Lint & test PHP backend
# ──────────────────────────────────────────────────────────────
  test-php:
    name: 🐘 Test PHP Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, json
          coverage: none

      - name: Validate PHP syntax
        working-directory: backend/php
        run: find . -name "*.php" -exec php -l {} \;

      - name: Install Composer dependencies
        working-directory: backend/php
        run: |
          if [ -f composer.json ]; then
            composer install --no-dev --optimize-autoloader
          else
            echo "No composer.json — skipping"
          fi

      - name: Run PHP CodeSniffer (PSR-12)
        working-directory: backend/php
        run: |
          if command -v phpcs &> /dev/null; then
            phpcs --standard=PSR12 api/
          else
            echo "phpcs not installed — skipping style check"
          fi

# ──────────────────────────────────────────────────────────────
# JOB 4 — Build & bundle (runs after all lint/test jobs pass)
# ──────────────────────────────────────────────────────────────
  build:
    name: 📦 Build
    runs-on: ubuntu-latest
    needs: [lint-frontend, test-nodejs, test-php]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build & minify frontend assets
        working-directory: frontend
        run: npm run build
        # Expected output in: frontend/dist/

      - name: Install Node.js backend dependencies (production only)
        working-directory: backend/nodejs
        run: npm ci --omit=dev

      - name: Create deployment archive
        run: |
          mkdir -p dist

          # Copy minified frontend
          cp -r frontend/dist dist/public

          # Copy Node.js backend
          cp -r backend/nodejs dist/server
          rm -rf dist/server/data   # exclude runtime data dir from artifact

          # Copy PHP backend
          cp -r backend/php dist/php
          rm -rf dist/php/data

          # Zip everything
          zip -r portfolio-dist.zip dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-build-${{ github.sha }}
          path: portfolio-dist.zip
          retention-days: 7

# ──────────────────────────────────────────────────────────────
# JOB 5 — Deploy to Staging  (on push to develop)
# ──────────────────────────────────────────────────────────────
  deploy-staging:
    name: 🧪 Deploy → Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.thanu-portfolio.dev

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: portfolio-build-${{ github.sha }}

      - name: Unzip distribution
        run: unzip portfolio-dist.zip

      # ── Option A: Deploy to a VPS via SSH ─────────────────
      - name: Deploy to staging server (SSH)
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key:      ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e

            # Backup current release
            if [ -d /var/www/portfolio/current ]; then
              cp -r /var/www/portfolio/current /var/www/portfolio/backup-$(date +%Y%m%d%H%M%S)
            fi

            mkdir -p /var/www/portfolio/releases/${{ github.sha }}

      - name: Upload files to staging (rsync)
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches:   -avz --delete
          path:       dist/
          remote_path: /var/www/portfolio/releases/${{ github.sha }}/
          remote_host: ${{ secrets.STAGING_HOST }}
          remote_user: ${{ secrets.STAGING_USER }}
          remote_key:  ${{ secrets.STAGING_SSH_KEY }}

      - name: Symlink & restart services on staging
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key:      ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e

            RELEASE=/var/www/portfolio/releases/${{ github.sha }}

            # Symlink current → new release
            ln -sfn "$RELEASE" /var/www/portfolio/current

            # Ensure runtime data dirs exist with right perms
            mkdir -p "$RELEASE/server/data" "$RELEASE/php/data"
            chmod 755 "$RELEASE/server/data" "$RELEASE/php/data"

            # Restart Node.js backend via PM2
            cd "$RELEASE/server"
            pm2 reload portfolio-api --update-env || pm2 start server.js --name portfolio-api

            # Reload Nginx
            sudo nginx -t && sudo systemctl reload nginx

            echo "✅ Staging deploy complete → ${{ github.sha }}"

      - name: Smoke test staging
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://staging.thanu-portfolio.dev)
          echo "HTTP status: $STATUS"
          [ "$STATUS" -eq 200 ] || (echo "❌ Staging smoke test failed" && exit 1)
          echo "✅ Staging is healthy"

# ──────────────────────────────────────────────────────────────
# JOB 6 — Deploy to Production  (on push to main)
# ──────────────────────────────────────────────────────────────
  deploy-production:
    name: 🌐 Deploy → Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://thanu-portfolio.dev

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: portfolio-build-${{ github.sha }}

      - name: Unzip distribution
        run: unzip portfolio-dist.zip

      - name: Deploy to production server (SSH)
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key:      ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            mkdir -p /var/www/portfolio/releases/${{ github.sha }}

      - name: Upload files to production (rsync)
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches:   -avz --delete
          path:       dist/
          remote_path: /var/www/portfolio/releases/${{ github.sha }}/
          remote_host: ${{ secrets.PROD_HOST }}
          remote_user: ${{ secrets.PROD_USER }}
          remote_key:  ${{ secrets.PROD_SSH_KEY }}

      - name: Activate release on production
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key:      ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e

            RELEASE=/var/www/portfolio/releases/${{ github.sha }}

            ln -sfn "$RELEASE" /var/www/portfolio/current

            mkdir -p "$RELEASE/server/data" "$RELEASE/php/data"
            chmod 755 "$RELEASE/server/data" "$RELEASE/php/data"

            cd "$RELEASE/server"
            pm2 reload portfolio-api --update-env || pm2 start server.js --name portfolio-api

            sudo nginx -t && sudo systemctl reload nginx

            echo "✅ Production deploy complete → ${{ github.sha }}"

      - name: Smoke test production
        run: |
          sleep 8
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://thanu-portfolio.dev)
          [ "$STATUS" -eq 200 ] || (echo "❌ Production smoke test failed" && exit 1)
          echo "✅ Production is healthy"

      - name: Tag release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = `release-${new Date().toISOString().slice(0,10)}-${context.sha.slice(0,7)}`;
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              ref:   `refs/tags/${tag}`,
              sha:   context.sha
            });
            console.log(`Tagged: ${tag}`);

# ──────────────────────────────────────────────────────────────
# JOB 7 — Notify on failure
# ──────────────────────────────────────────────────────────────
  notify-on-failure:
    name: 🔔 Notify on Failure
    runs-on: ubuntu-latest
    needs: [lint-frontend, test-nodejs, test-php, build, deploy-staging, deploy-production]
    if: failure()

    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "❌ *Portfolio CI/CD Failed*",
              "attachments": [{
                "color": "#d32f2f",
                "fields": [
                  { "title": "Repo",    "value": "${{ github.repository }}", "short": true },
                  { "title": "Branch",  "value": "${{ github.ref_name }}",   "short": true },
                  { "title": "Commit",  "value": "${{ github.sha }}",        "short": true },
                  { "title": "Actor",   "value": "${{ github.actor }}",      "short": true },
                  { "title": "Run URL", "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" }
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL:  ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
